{% extends "base.html" %}
{% block title %}Өглөг нэмэх{% endblock %}
{% block page_title %}Өглөг нэмэх{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
<div class="card"><div class="card-header"><i class="fas fa-arrow-up me-2 text-danger"></i>Шинэ өглөг</div>
<div class="card-body">
<form method="post">
    <div class="row g-3">
        <div class="col-md-6"><label class="form-label fw-semibold">Огноо *</label>
            <input type="date" name="date" class="form-control" value="{{ now.date().isoformat() }}" required></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Дуусах огноо</label>
            <input type="date" name="due_date" class="form-control"></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Нэхэмжлэлийн дугаар</label>
            <input type="text" name="invoice_no" class="form-control" placeholder="INV-001"></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Харилцагч *</label>
            <select name="partner_id" class="form-select" required>
                <option value="">— Сонгоно уу —</option>
                {% for p in partners %}<option value="{{ p.id }}">{{ p.name }}</option>{% endfor %}
            </select></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Дүн *</label>
            <div class="input-group"><input type="number" name="amount" class="form-control num text-end" min="0" step="1" required>
            <span class="input-group-text">₮</span></div></div>
        <div class="col-md-6"><label class="form-label fw-semibold">Тайлбар</label>
            <input type="text" name="description" class="form-control"></div>
    </div>
    <div class="d-flex gap-2 mt-4">
        <button type="submit" class="btn btn-danger"><i class="fas fa-save me-1"></i>Хадгалах</button>
        <a href="{{ url_for('payables') }}" class="btn btn-outline-secondary">Болих</a>
    </div>
</form>
</div></div>
</div></div>
{% endblock %}
