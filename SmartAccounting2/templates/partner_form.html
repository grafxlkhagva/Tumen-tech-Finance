{% extends "base.html" %}
{% block title %}Харилцагч{% endblock %}
{% block page_title %}{{ 'Харилцагч засах' if partner else 'Харилцагч нэмэх' }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-md-7">
<div class="card">
    <div class="card-header"><i class="fas fa-user me-2"></i>{{ 'Харилцагч засах' if partner else 'Шинэ харилцагч' }}</div>
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Код</label>
                    <input type="text" name="code" class="form-control" value="{{ partner.code if partner else '' }}" placeholder="C001">
                </div>
                <div class="col-md-8">
                    <label class="form-label fw-semibold">Нэр <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control" value="{{ partner.name if partner else '' }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Регистрийн дугаар</label>
                    <input type="text" name="register" class="form-control" value="{{ partner.register if partner else '' }}" placeholder="1234567">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Төрөл</label>
                    <select name="type" class="form-select">
                        {% for val, label in [('customer','Авлагатай (Худалдан авагч)'),('supplier','Өглөгтэй (Нийлүүлэгч)'),('both','Хоёул')] %}
                        <option value="{{ val }}" {{ 'selected' if partner and partner.type == val else '' }}>{{ label }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Утасны дугаар</label>
                    <input type="text" name="phone" class="form-control" value="{{ partner.phone if partner else '' }}">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">И-мэйл</label>
                    <input type="email" name="email" class="form-control" value="{{ partner.email if partner else '' }}">
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">Хаяг</label>
                    <input type="text" name="address" class="form-control" value="{{ partner.address if partner else '' }}">
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>Хадгалах</button>
                <a href="{{ url_for('partners') }}" class="btn btn-outline-secondary">Болих</a>
            </div>
        </form>
    </div>
</div>
</div>
</div>
{% endblock %}
