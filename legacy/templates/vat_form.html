{% extends "base.html" %}
{% block title %}НӨАТ нэмэх{% endblock %}
{% block page_title %}НӨАТ бүртгэл нэмэх{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-md-7">
<div class="card">
    <div class="card-header"><i class="fas fa-receipt me-2"></i>НӨАТ-ын мэдээлэл</div>
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Огноо <span class="text-danger">*</span></label>
                    <input type="date" name="date" class="form-control" value="{{ today }}" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Төрөл <span class="text-danger">*</span></label>
                    <select name="type" class="form-select" required>
                        <option value="in">Орлогын НӨАТ (авах)</option>
                        <option value="out">Зарлагын НӨАТ (төлөх)</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Нэхэмжлэлийн дугаар</label>
                    <input type="text" name="invoice_no" class="form-control" placeholder="INV-001">
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">
                        <i class="fas fa-user me-1 text-primary"></i>Харилцагч
                        <span class="text-muted fw-normal small ms-1">(сонгосон бол нэр/регистр автоматаар орно)</span>
                    </label>
                    <select name="partner_id" id="partnerSelect" class="form-select" onchange="fillPartner(this)">
                        <option value="">— Харилцагч сонгох —</option>
                        {% for p in partners %}
                        <option value="{{ p.id }}"
                                data-name="{{ p.name }}"
                                data-reg="{{ p.register or '' }}">
                            {{ p.name }}{% if p.register %} — {{ p.register }}{% endif %}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Харилцагчийн нэр</label>
                    <input type="text" name="partner_name" id="partnerName" class="form-control" placeholder="Компанийн нэр">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Регистрийн дугаар</label>
                    <input type="text" name="partner_register" id="partnerReg" class="form-control" placeholder="1234567">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Дүн (НӨАТ-гүй) <span class="text-danger">*</span></label>
                    <div class="input-group">
                        <input type="number" name="amount" id="amountInput" class="form-control num text-end"
                               placeholder="0" min="0" step="1" required oninput="calcVat()">
                        <span class="input-group-text">₮</span>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">НӨАТ (10%)</label>
                    <div class="input-group">
                        <input type="text" id="vatDisplay" class="form-control num text-end bg-light" readonly placeholder="0">
                        <span class="input-group-text">₮</span>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Нийт дүн</label>
                    <div class="input-group">
                        <input type="text" id="totalDisplay" class="form-control num text-end bg-light fw-bold" readonly placeholder="0">
                        <span class="input-group-text">₮</span>
                    </div>
                </div>
                <div class="col-12">
                    <div class="form-check">
                        <input type="checkbox" name="ebarimt_sent" class="form-check-input" id="ebarimtCheck">
                        <label class="form-check-label" for="ebarimtCheck">eBarimt илгээсэн</label>
                    </div>
                </div>
            </div>
            <div class="d-flex gap-2 mt-4">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save me-1"></i>Хадгалах
                </button>
                <a href="{{ url_for('vat') }}" class="btn btn-outline-secondary">Болих</a>
            </div>
        </form>
    </div>
</div>
</div>
</div>
{% endblock %}

{% block scripts %}
<script>
function calcVat() {
    const amt = parseFloat(document.getElementById('amountInput').value || 0);
    const vat = Math.round(amt * 0.1);
    document.getElementById('vatDisplay').value = vat.toLocaleString('mn-MN');
    document.getElementById('totalDisplay').value = (amt + vat).toLocaleString('mn-MN');
}
function fillPartner(sel) {
    const opt = sel.options[sel.selectedIndex];
    document.getElementById('partnerName').value = opt.dataset.name || '';
    document.getElementById('partnerReg').value  = opt.dataset.reg  || '';
}
</script>
{% endblock %}
