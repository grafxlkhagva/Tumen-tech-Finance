{% extends "base.html" %}
{% block title %}Ажилтан засах{% endblock %}
{% block page_title %}{{ emp.full_name }} — мэдээлэл засах{% endblock %}

{% block topbar_actions %}
<a href="{{ url_for('salary_employees') }}" class="btn btn-outline-secondary btn-sm">
  <i class="fas fa-arrow-left me-1"></i>Буцах
</a>
{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-lg-6">
<div class="card">
  <div class="card-header py-2" style="background:#1a3c5e;color:#fff;font-size:.85rem;font-weight:700">
    <span style="width:10px;height:10px;border-radius:50%;background:{{ emp.color }};display:inline-block;margin-right:6px"></span>
    {{ emp.full_name }}
  </div>
  <div class="card-body">
  <form method="post">
    <div class="row g-3">
      <div class="col-6">
        <label class="form-label small fw-semibold">Нэр</label>
        <input type="text" name="name" class="form-control form-control-sm" value="{{ emp.name }}" required>
      </div>
      <div class="col-6">
        <label class="form-label small fw-semibold">Овог</label>
        <input type="text" name="lastname" class="form-control form-control-sm" value="{{ emp.lastname or '' }}">
      </div>
      <div class="col-12">
        <label class="form-label small fw-semibold">Албан тушаал</label>
        <input type="text" name="title" class="form-control form-control-sm" value="{{ emp.title or '' }}">
      </div>
      <div class="col-6">
        <label class="form-label small fw-semibold">РД (Регистрийн дугаар)</label>
        <input type="text" name="tin" class="form-control form-control-sm font-monospace" value="{{ emp.tin or '' }}">
      </div>
      <div class="col-6">
        <label class="form-label small fw-semibold">Ажлын жил</label>
        <input type="number" name="exp_years" class="form-control form-control-sm" value="{{ emp.exp_years or 0 }}">
      </div>
      <div class="col-6">
        <label class="form-label small fw-semibold">Үндсэн цалин (₮)</label>
        <input type="number" name="base_salary" class="form-control form-control-sm font-monospace"
               value="{{ emp.base_salary|int }}" step="10000">
      </div>
      <div class="col-6">
        <label class="form-label small fw-semibold">Урьдчилгааны суурь (₮) <span class="text-muted">(хоосон = 40%)</span></label>
        <input type="number" name="adv_base" class="form-control form-control-sm font-monospace"
               value="{{ emp.adv_base|int if emp.adv_base else '' }}" step="10000" placeholder="Хоосон → үндсэн×40%">
      </div>
      <div class="col-6">
        <label class="form-label small fw-semibold">Утасны дугаар</label>
        <input type="text" name="phone" class="form-control form-control-sm font-monospace"
               value="{{ emp.phone or '' }}" placeholder="99112233">
      </div>
      <div class="col-6">
        <label class="form-label small fw-semibold">И-мэйл хаяг</label>
        <input type="email" name="email" class="form-control form-control-sm"
               value="{{ emp.email or '' }}" placeholder="name@example.mn">
      </div>
      <div class="col-6">
        <label class="form-label small fw-semibold">Утасны нэмэгдэл (₮)</label>
        <input type="number" name="phone_allowance" class="form-control form-control-sm font-monospace"
               value="{{ emp.phone_allowance|int }}" step="1000">
      </div>
      <div class="col-6">
        <label class="form-label small fw-semibold">Банк</label>
        <input type="text" name="bank" class="form-control form-control-sm" value="{{ emp.bank or '' }}">
      </div>
      <div class="col-12">
        <label class="form-label small fw-semibold">Дансны дугаар</label>
        <input type="text" name="account" class="form-control form-control-sm font-monospace"
               value="{{ emp.account or '' }}">
      </div>
    </div>
    <div class="mt-3 d-flex gap-2">
      <button type="submit" class="btn btn-primary btn-sm">
        <i class="fas fa-save me-1"></i>Хадгалах
      </button>
      <a href="{{ url_for('salary_employees') }}" class="btn btn-outline-secondary btn-sm">Болих</a>
    </div>
  </form>
  </div>
</div>
</div>
</div>
{% endblock %}
